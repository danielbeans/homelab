---
services:
  plex:
    container_name: plex
    image: plexinc/pms-docker
    restart: unless-stopped
    environment:
      - TZ=$TIMEZONE
      - PLEX_UID=$PLEX_UID
      - PLEX_GID=$PLEX_GID
    volumes:
      - $HOST_VOLUME_PATH:/config
      - $HOST_VOLUME_MEDIA_PATH:/data
networks:
  default:
    external: true
    name: nginx-proxy-manager
