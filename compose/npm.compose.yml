---
services:
  app:
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - $HOST_PORT_ADMIN:$CONTAINER_PORT_ADMIN
    volumes:
      - /mnt/tank/docker/nginx-proxy-manager/data:/data
      - /mnt/tank/docker/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
networks:
  default:
    external: true
    name: nginx-proxy-manager
