# https://github.com/trentnbauer/agg/blob/main/docker-compose/cloudflared.yml
---
version: "3.8"
services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - TUNNEL_TOKEN=$CLOUDFLARE_UUID
      - TUNNEL_METRICS=0.0.0.0:5566
    command: tunnel run
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - cloudflared
        - --version
      interval: 60s
      timeout: 55s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
networks: {}
