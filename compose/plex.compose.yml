---
version: "3.8"
services:
  plex:
    container_name: plex
    image: plexinc/pms-docker
    restart: unless-stopped
    environment:
      - TZ=$TIMEZONE
      - PLEX_UID=$PLEX_UID
      - PLEX_GID=$PLEX_GID
    volumes:
      - /mnt/tank/docker/plex:/config
      - /mnt/tank/docker/plex:/transcode
      - /mnt/tank/plex-media:/data
networks:
  default:
    external: true
    name: nginx-proxy-manager
